<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fondo Azul Noche -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gradiente Naranja Impulso -->
    <linearGradient id="orangeImpulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Gradiente Dorado / Luz -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Sombra suave del Isotipo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Contenedor Base (Squircle Redondeado) -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="#f97316" stroke-width="6" stroke-opacity="0.35" filter="url(#dropShadow)" />

  <!-- Geometría Central: Hogar / Techo Barrial -->
  <g transform="translate(256, 260)">
    <!-- Silueta del Techo (Comunidad de Río Cuarto) -->
    <path d="M-140 -20 L0 -140 L140 -20 L110 0 L0 -95 L-110 0 Z" fill="#ffffff" opacity="0.95" />

    <!-- Rayo / Impulso Central (Superación y Progreso) -->
    <path d="M-15 -90 L20 -90 L-10 -30 L25 -30 L-30 65 L-5 -10 L-30 -10 Z" fill="url(#amberGlow)" filter="drop-shadow(0 4px 10px rgba(245, 158, 11, 0.6))" />

    <!-- Llave Mecánica Estilizada (Oficios Técnicos / Fontanería / Electricidad) -->
    <g transform="rotate(-32)">
      <path d="M-90 -15 L-30 -15 L-25 15 L-90 15 Z" fill="url(#orangeImpulse)" />
      <!-- Mandíbula de la llave -->
      <path d="M-90 -35 A 40 40 0 1 0 -90 35 L-70 18 A 20 20 0 1 1 -70 -18 Z" fill="url(#orangeImpulse)" />
      <!-- Orificio base de la herramienta -->
      <circle cx="-15" cy="0" r="8" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Martillo / Maza de Albañilería y Construcción -->
    <g transform="rotate(32)">
      <rect x="15" y="-12" width="80" height="24" rx="6" fill="#ffffff" opacity="0.95" />
      <!-- Cabeza del martillo -->
      <path d="M85 -30 L115 -30 L115 30 L85 30 L80 15 L80 -15 Z" fill="url(#orangeImpulse)" />
    </g>

    <!-- Arco de Manos / Unión Vecinal Inferior -->
    <path d="M-90 85 C -45 125, 45 125, 90 85" fill="none" stroke="url(#orangeImpulse)" stroke-width="14" stroke-linecap="round" />
    <circle cx="0" cy="112" r="9" fill="url(#amberGlow)" />
  </g>
</svg>
