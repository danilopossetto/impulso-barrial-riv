<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="orangeImpulseFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="amberGlowFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="shadowFull" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ISOTIPO (Lado Izquierdo) -->
  <g transform="translate(15, 15)">
    <!-- Squircle del Isotipo -->
    <rect x="0" y="0" width="190" height="190" rx="46" fill="url(#bgGradFull)" stroke="#f97316" stroke-width="3" stroke-opacity="0.4" filter="url(#shadowFull)" />
    
    <g transform="translate(95, 100) scale(0.38)">
      <!-- Techo Hogar -->
      <path d="M-140 -20 L0 -140 L140 -20 L110 0 L0 -95 L-110 0 Z" fill="#ffffff" opacity="0.95" />
      <!-- Rayo Impulso -->
      <path d="M-15 -90 L20 -90 L-10 -30 L25 -30 L-30 65 L-5 -10 L-30 -10 Z" fill="url(#amberGlowFull)" />
      <!-- Llave Mecánica -->
      <g transform="rotate(-32)">
        <path d="M-90 -15 L-30 -15 L-25 15 L-90 15 Z" fill="url(#orangeImpulseFull)" />
        <path d="M-90 -35 A 40 40 0 1 0 -90 35 L-70 18 A 20 20 0 1 1 -70 -18 Z" fill="url(#orangeImpulseFull)" />
        <circle cx="-15" cy="0" r="8" fill="#ffffff" />
      </g>
      <!-- Martillo -->
      <g transform="rotate(32)">
        <rect x="15" y="-12" width="80" height="24" rx="6" fill="#ffffff" opacity="0.95" />
        <path d="M85 -30 L115 -30 L115 30 L85 30 L80 15 L80 -15 Z" fill="url(#orangeImpulseFull)" />
      </g>
      <!-- Arco de Unión -->
      <path d="M-90 85 C -45 125, 45 125, 90 85" fill="none" stroke="url(#orangeImpulseFull)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="112" r="9" fill="url(#amberGlowFull)" />
    </g>
  </g>

  <!-- TIPOGRAFÍA Y MARCA (Lado Derecho) -->
  <g transform="translate(235, 30)">
    <!-- Badge de Localidad Río Cuarto -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="138" height="26" rx="13" fill="#ffedd5" stroke="#fed7aa" stroke-width="1" />
      <text x="69" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#c2410c" text-anchor="middle" letter-spacing="0.5">RÍO CUARTO</text>
    </g>

    <!-- Título Principal: OFICIOS BARRIALES -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#0f172a" letter-spacing="-1">
      OFICIOS BARRIALES
    </text>

    <!-- Subtítulo Institucional: IMPULSO BARRIAL RIV S.A.S. -->
    <text x="2" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#f97316" letter-spacing="3.5">
      IMPULSO BARRIAL RIV S.A.S.
    </text>

    <!-- Línea descriptiva / Lema -->
    <text x="2" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#64748b" letter-spacing="0.8">
      RED DE TRABAJO INDEPENDIENTE Y SERVICIOS DE CERCANÍA
    </text>
  </g>
</svg>
